<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Preferences</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="./assets/icon/favicon.svg">
  <link rel="icon" type="image/png" href="./assets/icon/favicon.png">
</head>
<body>
<div class="main-container">
  <div class="signup-form">
    <ol class="steps">
      <li class="done">General</li>
      <li class="done">Contact</li>
      <li class="done">Work</li>
      <li class="active">Preferences</li>
    </ol>
    <h1>Create your account</h1>
    <h2>Preferences</h2>
    <form action="./Login.html" method="get">
      <label class="check" for="receive-notifications">
        <input type="checkbox" id="receive-notifications" name="receive-notifications">
        Send me notifications
      </label>
      <button type="submit">Complete sign up</button>
    </form>
    <a class="back" href="./signup2.html">Back</a>
  </div>
</div>
</body>
</html>
