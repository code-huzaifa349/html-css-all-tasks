<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="./assets/icon/favicon.svg">
  <link rel="icon" type="image/png" href="./assets/icon/favicon.png">
</head>
<body>
<div class="main-container">
  <div class="login-form">
    <h1>Welcome back</h1>
    <p>Log in to continue.</p>
    <form action="./dashboard.html" method="get">
      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required></div>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">New here? <a href="./index.html">Create an account</a></p>
  </div>
</div>
</body>
</html>
